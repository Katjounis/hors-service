<!doctype html><html><body><canvas id="c"></canvas><script>
// table en chêne clair vue de dessus : bruit fractal étiré dans le sens du fil, lames de teintes variées, joints fins
const W = 1400, H = 1400; const c = document.getElementById('c'); c.width = W; c.height = H; const g = c.getContext('2d');
let seed = 23; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const P = new Uint8Array(512); { const p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) P[i] = p[i & 255]; }
const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
function grad(h, x, y) { const u = h & 1 ? x : -x, v = h & 2 ? y : -y; return u + v; }
function perlin(x, y) { const X = Math.floor(x) & 255, Y = Math.floor(y) & 255; x -= Math.floor(x); y -= Math.floor(y); const u = fade(x), v = fade(y);
  const a = P[X] + Y, b = P[X + 1] + Y;
  const l = (t, a1, b1) => a1 + t * (b1 - a1);
  return l(v, l(u, grad(P[a], x, y), grad(P[b], x - 1, y)), l(u, grad(P[a + 1], x, y - 1), grad(P[b + 1], x - 1, y - 1))); }
function fbm(x, y, o = 4) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < o; i++) { s += a * perlin(x * f, y * f); f *= 2; a *= 0.5; } return s; }
const img = g.createImageData(W, H); const d = img.data;
const planks = []; let x0 = 0; while (x0 < W) { const w = 230 + Math.floor(rnd() * 70); planks.push({ x: x0, w, tone: [1.0, 0.95, 1.04, 0.92, 0.98][planks.length % 5] * (0.97 + rnd() * 0.06), ox: rnd() * 100, oy: rnd() * 100, cut: Math.floor(rnd() * H) }); x0 += w; }
for (const p of planks) {
  for (let y = 0; y < H; y++) for (let x = p.x; x < Math.min(W, p.x + p.w); x++) {
    const lx = x - p.x;
    // gros veinage : bandes le long du fil, ondulées
    const wob = fbm(y / 420 + p.oy, lx / 160 + p.ox, 3) * 40;
    const streak = fbm((lx + wob) / 9 + p.ox, y / 520 + p.oy, 4);
    // fibres fines
    const fiber = fbm((lx) / 1.6 + p.ox * 3, y / 90 + p.oy, 2);
    // flammes (dessin de cathédrale) discrètes au centre de la lame
    const cath = Math.sin(((lx - p.w / 2) / p.w) * 6 + fbm(y / 300 + p.oy, p.ox, 2) * 4 + y / 180) * Math.exp(-Math.pow((lx - p.w / 2) / (p.w * 0.3), 2));
    let v = 0.82 + streak * 0.22 + fiber * 0.06 + cath * 0.035;
    v *= p.tone;
    let e = 1; if (lx < 2 || lx > p.w - 3) e = 0.55; if (y === p.cut || y === p.cut + 1) e = 0.6;
    const i = (y * W + x) * 4;
    d[i] = Math.min(255, 226 * v * e); d[i + 1] = Math.min(255, 190 * v * e); d[i + 2] = Math.min(255, 142 * v * e); d[i + 3] = 255;
  }
}
g.putImageData(img, 0, 0);
window.__done = c.toDataURL('image/png');
</script></body></html>
