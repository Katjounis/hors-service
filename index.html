.paper .btn-danger { border-color: var(--rouge-vif); color: var(--rouge-vif); }
.paper .icon-btn { border-color: var(--ligne-2); color: var(--papier); }
.paper .icon-btn:hover:not(:disabled) { background: rgba(242, 234, 219, .07); }
.paper :focus-visible { outline-color: var(--jaune); }
.paper .panel { background: rgba(242, 234, 219, .04); border-color: var(--ligne); color: var(--papier); }
.paper .panel-warn { border-color: var(--rouge-vif); }
.paper .role-tag.is-imp { color: var(--rouge-vif); }
.paper .player, .paper .tbl td, .rules li, .notice li, .register .player:first-child, .report-head, .report-foot, .award,
.hippo-res li, .hippo-podium, .hippo-podium li, .tomb-hands li, .hippo-now, .paper details.log, .pipo-order li, .pipo-gone li,
.claim, .player, .player:first-child, .menu-item, .menu-item:first-child, .tbl td, details.log { border-color: var(--ligne); }
.tbl th { border-bottom: 1px solid var(--ligne-2); color: var(--poussiere); }
.rules li:first-child { border-top-width: 1px; }
.soiree, .sv-side h2, .sv-tally { color: var(--papier); }
.suit-H b, .suit-D b { color: var(--rouge-vif); }
.hippo-run { border-bottom-color: var(--ligne-2); background: repeating-linear-gradient(90deg, rgba(242, 234, 219, .09) 0 1px, transparent 1px calc(100% / 7)); }
.tomb-cell.is-now { outline-color: var(--jaune); }
.g96-q { border-color: var(--ligne-2); border-radius: var(--r-s); }
.duel-vs em { color: var(--poussiere); }
.recall-slot { border-radius: 8px; }
.tc-hint { background: var(--jaune); color: var(--encre); border-radius: 6px; }

/* les vraies cartes restent en papier crème */
.ose-card.paper, .jn-card.paper, .qo-card.paper, .word-card.paper {
  background: var(--papier); color: var(--encre); --t2: var(--crayon); border: 0;
  -webkit-backdrop-filter: none; backdrop-filter: none;
  box-shadow: 0 22px 44px -22px rgba(0, 0, 0, .8), 0 2px 0 rgba(255, 255, 255, .5) inset;
}
.ose-card .chip, .jn-card .chip, .qo-card .chip { background: transparent; border-color: currentColor; color: var(--t2); }
.word-card.tape::before { display: block; }
.qo-list li.paper { border-radius: var(--r-s); }

/* ---------- formes : coins arrondis, filets fins */
.btn { border-radius: var(--r-s); border: 1.5px solid var(--ligne-2); background: rgba(24, 20, 19, .55); }
.btn:hover:not(:disabled) { background: rgba(242, 234, 219, .07); }
.btn-main { background: var(--jaune); border-color: var(--jaune); color: var(--encre); box-shadow: 0 10px 26px -14px rgba(255, 210, 63, .7); }
.btn-main:hover:not(:disabled) { background: var(--jaune-2); }
.btn-ghost { border-color: transparent; background: transparent; text-decoration: none; color: var(--poussiere); }
.btn-ghost:hover:not(:disabled) { color: var(--papier); background: transparent; }
.btn-small { border-width: 1px; }
.icon-btn { border-radius: var(--r-s); border-color: var(--ligne-2); background: rgba(24, 20, 19, .55); }
.icon-round { width: 48px; height: 48px; border-radius: 50%; }
.input, .codebox-cell { border-radius: var(--r-s); border-width: 1.5px; border-color: var(--ligne-2); background: rgba(24, 20, 19, .6); }
.input:focus { border-color: var(--jaune); }
.codebox-cell { font-family: var(--f-titre); font-weight: 400; }
.seg { border-radius: var(--r-s); overflow: hidden; border-color: var(--ligne-2); background: rgba(24, 20, 19, .45); }
.seg-btn { border-left-color: var(--ligne); }
.panel { border-radius: var(--r-s); border-color: var(--ligne); background: var(--surface); }
.note { border-radius: var(--r-s); border-width: 1.5px; }
.chip { border-radius: 999px; padding: 4px 10px; border-color: var(--ligne-2); background: rgba(20, 16, 15, .6); font: 600 .8rem/1.3 var(--f-texte); color: var(--poussiere); }
.you, .tag, .role-tag { border-radius: 999px; padding: 0 8px; }
.multi-btn, .avatar-btn, .pgrid-btn, .horse-btn, .key, .qo-vote, .dock-mini, .gage-list li, .maker-opt, .seat, .bus-slot, .purple-pass, .banner, .legal-host, .chip-btn { border-radius: var(--r-s); }
.multi-btn, .avatar-btn, .pgrid-btn, .horse-btn, .key, .seat { border-color: var(--ligne-2); }
.maker-opt.is-color { border-radius: 50%; }
.toast { border-radius: var(--r-s); border: 0; box-shadow: 0 12px 30px -12px rgba(0, 0, 0, .8); }
.pc { border-radius: 6px; }
.pc-xs { border-radius: 4px; }
.tampon { font-weight: 400; letter-spacing: .02em; }
.ruban { height: 6px; border-radius: 3px; }
.sante { border-top: 0; }
.topbar { background: rgba(18, 14, 15, .7); border-bottom: 1px solid var(--ligne); }
.topbar-code b { font: 400 1.2rem var(--f-titre); letter-spacing: .1em; }
.code { font-family: var(--f-titre); font-weight: 400; letter-spacing: .12em; }
.act { border: 1px solid var(--ligne-2); border-radius: var(--r); background: var(--surface-2); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.act h3 { font-size: 1.35rem; }
.game-head h1 { font-size: 2.2rem; }
.game-no { font: 600 .9rem/1.2 var(--f-texte); }
.turn-who { font: 400 2rem/1.05 var(--f-titre); }
.end-title { font: 400 1.4rem/1.15 var(--f-titre); }
.report-head h2 { font-size: 1.7rem; }
.jn-badge { border-radius: 999px; font: 700 .72rem/1.2 var(--f-texte); letter-spacing: .08em; }
.jn-card { padding-top: 40px; }
.myword { border-radius: var(--r-s); border-color: var(--ligne-2); }
.qr { border-radius: var(--r-s); border: 0; padding: 8px; }
.wrapped-img { border-radius: var(--r); border: 1px solid var(--ligne-2); }

/* ---------- logo : la seule affichette scotchée qui reste */
.brand { margin: 12px 0 0 4px; }
.brand-name { font: 400 clamp(2.4rem, 11.5vw, 3.3rem)/.9 var(--f-titre); text-transform: uppercase; letter-spacing: .01em; }
.brand-stripe { height: 10px; margin-top: 10px; }
.brand-s .brand-name { font-size: 1.35rem; }

/* ---------- accueil : deux gros choix */
.home { gap: 20px; padding-top: 22px; min-height: 100vh; min-height: 100dvh; }
.home-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.home-lead { color: var(--poussiere); margin-top: -4px; }
.home-choices { display: flex; flex-direction: column; gap: 12px; }
.choice {
  position: relative; display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; column-gap: 14px; row-gap: 2px;
  align-items: center; width: 100%; min-height: 92px; padding: 16px 16px 16px 16px; text-align: left; cursor: pointer;
  border-radius: 22px; border: 1px solid var(--ligne-2); background: var(--surface); color: var(--papier);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  transition: scale .32s cubic-bezier(.3, 1.7, .5, 1), background-color .15s ease, box-shadow .2s ease;
  animation: tuile .45s var(--ressort) backwards;
}
.choice:nth-child(2) { animation-delay: .06s; }
.choice:nth-child(3) { animation-delay: .12s; }
.choice::after { content: ''; grid-column: 3; grid-row: 1 / 3; width: 10px; height: 10px; border: solid currentColor; border-width: 2.5px 2.5px 0 0; transform: rotate(45deg); opacity: .55; margin-right: 6px; }
.choice:hover { background: var(--surface-2); }
.choice:active { scale: .97; transition-duration: .06s; }
.choice-ico { grid-row: 1 / 3; grid-column: 1; display: flex; align-items: center; justify-content: center; gap: 0; width: 52px; height: 52px; border-radius: 16px; background: rgba(242, 234, 219, .07); }
.choice-ico .ico + .ico { margin-left: -12px; opacity: .7; }
.choice-t { grid-column: 2; font: 400 1.4rem/1.1 var(--f-titre); }
.choice-d { grid-column: 2; color: var(--poussiere); font-size: .95rem; }
.choice-main { background: var(--jaune); border-color: var(--jaune); color: var(--encre); box-shadow: 0 18px 40px -18px rgba(255, 210, 63, .65); }
.choice-main:hover { background: var(--jaune-2); }
.choice-main .choice-d { color: rgba(34, 32, 28, .72); }
.choice-main .choice-ico { background: rgba(34, 32, 28, .1); }
.home-foot { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 0; text-align: center; color: var(--poussiere); font-size: .78rem; padding-top: 18px; }
.home-foot .legal-links { gap: 0 14px; }
.home-foot .link { min-height: 44px; padding: 6px 2px; font-weight: 600; font-size: .8rem; color: var(--poussiere); text-decoration: none; }
.home-foot .link:hover { color: var(--papier); }
@keyframes tuile { from { opacity: 0; transform: translateY(14px) scale(.97); } }

/* ---------- liste des jeux : tuiles compactes, une couleur par jeu */
.tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding-top: 0; }
.tile {
  display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-height: 128px; padding: 14px; overflow: hidden;
  border-radius: var(--r); border: 1px solid var(--ligne); color: var(--papier); text-align: left;
  background: linear-gradient(155deg, rgba(var(--c), .22), rgba(var(--c), .03) 62%), var(--surface);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  animation: tuile .42s var(--ressort) backwards; animation-delay: calc(var(--n, 1) * 32ms);
}
.tile:hover, .tile.kraft:hover, .tile.rose:hover { background: linear-gradient(155deg, rgba(var(--c), .3), rgba(var(--c), .06) 62%), var(--surface-2); }
.tile-ico { width: 46px; height: 46px; border: 0; border-radius: 14px; background: rgba(var(--c), .2); color: rgb(var(--c)); display: grid; place-items: center; }
.tile-name { margin-top: auto; font: 400 1.15rem/1.1 var(--f-titre); }
.tile-min { grid-column: auto; margin: 0; font: 600 .8rem/1.2 var(--f-texte); color: var(--poussiere); }
.tile.is-off { opacity: .45; color: var(--papier); }
.tile.is-off .tile-ico { border: 0; }
.lobby h1 { font-size: 1.9rem; }
.register h2 { font-size: 1.3rem; }
.register .player:first-child { border-top-width: 1px; }
.sec > h2 { font-size: 1.3rem; }

/* ---------- feuilles : montent du bas, coins arrondis */
.sheet-wrap { background: rgba(10, 8, 8, .62); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); animation: fondu .2s ease both; }
.sheet { background: #1C1816; border-top: 1px solid var(--ligne-2); border-radius: 24px 24px 0 0; animation: monte .32s var(--ressort) both; }
.sheet::before { content: ''; display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--ligne-2); margin: -6px auto 12px; }
.sheet-head h2 { font-size: 1.6rem; }
.sheet-tag { font-size: 1.05rem; }
.rules.paper { background: rgba(242, 234, 219, .04); padding: 6px 14px; -webkit-backdrop-filter: none; backdrop-filter: none; }
.rules li::before { font: 400 1rem/1.4 var(--f-titre); color: var(--poussiere); }
.rules-fold { border: 1px solid var(--ligne); border-radius: var(--r-s); padding: 0 14px; }
.rules-fold summary { cursor: pointer; font-weight: 700; min-height: 48px; display: flex; align-items: center; justify-content: space-between; list-style: none; }
.rules-fold summary::-webkit-details-marker { display: none; }
.rules-fold summary::after { content: ''; width: 9px; height: 9px; border: solid currentColor; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); transition: transform .2s ease; margin-right: 4px; }
.rules-fold[open] summary::after { transform: rotate(-135deg); }
.rules-fold .rules.paper { background: transparent; border: 0; padding: 0 0 8px; }
@keyframes monte { from { transform: translateY(40px); opacity: 0; } }
@keyframes fondu { from { opacity: 0; } }

/* ---------- transitions et toucher */
.ecran { animation: entree .3s var(--ressort) backwards; }
@keyframes entree { from { opacity: 0; transform: translateY(12px); } }
.btn:active:not(:disabled) { scale: .95; }
.pose { animation: poser .28s var(--ressort) both; }
@keyframes poser { from { translate: 0 14px; opacity: 0; } }
.ose-card.paper, .jn-card.paper, .qo-card.paper { animation: carte .45s var(--ressort) both; }
@keyframes carte { from { opacity: 0; transform: translateY(18px) rotateX(18deg) scale(.96); } }

/* ---------- pénalités et distributions : bandeau rouge = tu prends, bandeau jaune = tu donnes */
.dock::before { background: linear-gradient(180deg, rgba(16, 13, 12, 0), rgba(16, 13, 12, .94) 26px); border-top: 0; }
.pen {
  gap: 12px; padding: 0 0 14px; overflow: hidden; transform: none;
  background: #1F1A18; color: var(--papier); border: 1px solid var(--ligne-2); border-radius: 22px;
  box-shadow: 0 -12px 40px -14px rgba(0, 0, 0, .85);
  animation: monte .32s var(--ressort) both;
}
.pen-take { animation: monte .32s var(--ressort) both, tremble .45s .3s cubic-bezier(.36, .07, .19, .97) backwards; }
.pen > :not(.pen-band) { margin-left: 14px; margin-right: 14px; }
.pen-band { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 14px; background: var(--rouge); color: #FFF4EC; }
.pen-give .pen-band { background: var(--jaune); color: var(--encre); }
.pen-kind { flex: 1; font: 400 1.3rem/1 var(--f-titre); }
.pen-band .dock-who { font-weight: 700; color: inherit; }
.pen-band .pen-ref { color: inherit; opacity: .85; font: 700 .82rem var(--f-texte); }
.pen-main { display: flex; flex-direction: column; gap: 6px; padding-top: 2px; }
.pen-big { font: 600 1.05rem/1.1 var(--f-texte); color: var(--poussiere); animation: pop-in .4s cubic-bezier(.3, 1.6, .5, 1) backwards; }
.pen-big b { font: 400 3.1rem/1 var(--f-titre); color: #FF8A6A; margin-right: 6px; vertical-align: -4px; }
.pen-give .pen-big b { color: var(--jaune); }
.pen-big-t { font: 400 2.3rem/1 var(--f-titre); color: #FF8A6A; }
.pen-from { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 1.02rem; }
.pen-from span { color: var(--poussiere); }
.pen .pen-why, .pen-why { color: var(--poussiere); font-size: .95rem; }
.pen-defi-txt { font-size: 1.1rem; font-weight: 700; padding: 10px 12px; border-radius: var(--r-s); background: rgba(242, 234, 219, .06); }
.pen-left { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 700; }
.pen-dots { display: flex; gap: 5px; flex-wrap: wrap; }
.pen-dots i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--jaune); transition: background-color .15s ease, scale .25s cubic-bezier(.3, 1.7, .5, 1); }
.pen-dots i.on { background: var(--jaune); scale: 1.15; }
.pen .btn { min-height: 46px; }
.pen-btns { gap: 8px; }
.dist-row { border-bottom-color: var(--ligne); }
.dist-row.is-on .dist-who span { text-decoration: none; color: var(--jaune); }
.dist-n { font: 400 1.4rem var(--f-titre); }
.dist-row.is-on .dist-n { color: var(--jaune); }
.pen-later { color: var(--poussiere); text-decoration: none; font-size: .9rem; font-weight: 600; }
.dock-mini { border-radius: 999px; border: 1px solid var(--ligne-2); background: var(--surface-2); }

/* ---------- Purple jusqu'à la mort */
.btn-mort {
  flex-direction: column; gap: 2px; min-height: 64px; margin-top: 4px; position: relative; overflow: hidden;
  border: 0; color: #fff; background: linear-gradient(110deg, #C8301E 0%, #6B2BB8 52%, #1E1A2E 100%);
  box-shadow: 0 12px 30px -14px rgba(140, 60, 220, .9);
}
.btn-mort:hover:not(:disabled) { background: linear-gradient(110deg, #D63A26 0%, #7A35CC 52%, #2A2440 100%); }
.btn-mort::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .22) 50%, transparent 70%); transform: translateX(-100%); animation: reflet 3.2s ease-in-out infinite; }
.btn-mort-t { font: 400 1.25rem/1.05 var(--f-titre); }
.btn-mort-d { font-size: .82rem; opacity: .85; font-weight: 600; }
.btn-mort.is-armed { animation: tremble .5s cubic-bezier(.36, .07, .19, .97) both; outline: 3px solid var(--jaune); outline-offset: 2px; }
@keyframes reflet { 0%, 55% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

.mort {
  --heat: 0;
  position: fixed; inset: 0; z-index: 88; display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(120% 80% at 50% 45%, rgba(48, 14, 60, .92), rgba(8, 4, 10, .97) 70%);
  animation: fondu .3s ease both; color: var(--papier);
  padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
}
.mort-spots { position: absolute; inset: 0; pointer-events: none; }
.mort-spots i { position: absolute; top: -20%; width: 46vmax; height: 140vmax; left: 50%; margin-left: -23vmax; transform-origin: 50% 0;
  background: linear-gradient(180deg, rgba(255, 60, 60, .32), rgba(255, 60, 60, 0) 70%); filter: blur(6px); opacity: .7;
  animation: balaye calc(3.4s - var(--heat) * .38s) ease-in-out infinite alternate; mix-blend-mode: screen; }
.mort-spots i:nth-child(2) { background: linear-gradient(180deg, rgba(160, 90, 255, .34), rgba(160, 90, 255, 0) 70%); animation-delay: -1.1s; animation-direction: alternate-reverse; }
.mort-spots i:nth-child(3) { background: linear-gradient(180deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, 0) 60%); animation-delay: -.6s; width: 20vmax; margin-left: -10vmax; }
.mort-spots i:nth-child(4) { background: linear-gradient(180deg, rgba(255, 210, 63, .2), rgba(255, 210, 63, 0) 60%); animation-delay: -2s; animation-direction: alternate-reverse; width: 26vmax; margin-left: -13vmax; }
@keyframes balaye { from { transform: rotate(-38deg); } to { transform: rotate(38deg); } }
.mort-in { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; width: min(100%, 460px); }
.mort-who { font-weight: 700; color: var(--poussiere); }
.mort-title { font: 400 clamp(1.8rem, 8vw, 2.6rem)/1 var(--f-titre); background: linear-gradient(90deg, #FF6A50, #B57CFF); -webkit-background-clip: text; background-clip: text; color: transparent; }
.mort-pair { display: flex; gap: 14px; justify-content: center; min-height: 132px; padding: 8px 0; animation: secoue-c .25s ease-out; }
.mort-pair .pc-l { width: clamp(78px, 24vw, 104px); }
.mort-pair .pc-l .pc-mid { font-size: 3rem; }
.mort-card { animation: tombe-c .38s var(--ressort) backwards; animation-delay: var(--d, 0ms); filter: drop-shadow(0 14px 22px rgba(0, 0, 0, .6)); }
@keyframes tombe-c { from { transform: translateY(-40px) rotate(-8deg) scale(1.15); opacity: 0; } }
@keyframes secoue-c { 0% { transform: scale(1.04); } 100% { transform: scale(1); } }
.mort-count { font-size: 1.1rem; }
.mort-count b { font: 400 2.4rem/1 var(--f-titre); color: var(--jaune); vertical-align: -5px; margin-left: 4px; }
.mort-strip { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; opacity: .7; }
.mort-mini { display: inline-flex; gap: 2px; }
.mort-taunt { font: 400 1.15rem var(--f-titre); color: #FF8A6A; animation: pop-in .35s cubic-bezier(.3, 1.6, .5, 1) backwards; }
.mort-end { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.mort-end .tampon { font-size: clamp(3rem, 15vw, 4.6rem); color: #B57CFF; border-width: 5px; animation: tampon-xl .5s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes tampon-xl { from { transform: rotate(var(--rot, -6deg)) scale(2.4); opacity: 0; } }
.mort-verdict { font-size: 1.15rem; font-weight: 700; max-width: 28ch; }
.mort-close { color: var(--poussiere); font-size: .9rem; animation: fondu .4s 1.2s ease both; }
.mort.is-done { cursor: pointer; }
.mort.is-done::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, rgba(181, 124, 255, .55), rgba(181, 124, 255, 0) 60%); animation: eclair-v 1s ease-out both; }
@keyframes eclair-v { 0% { opacity: 1; transform: scale(.6); } 100% { opacity: .35; transform: scale(1.4); } }
.mort-son { position: absolute; z-index: 3; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; min-height: 40px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--ligne-2); background: rgba(0, 0, 0, .35); color: var(--papier); font: 600 .82rem var(--f-texte); cursor: pointer; }
.mort.is-calm .mort-spots { display: none; }
@media (prefers-reduced-motion: reduce) { .mort-spots { display: none; } }
.mort { background: radial-gradient(120% 80% at 50% 45%, #2E0E3A, #0A050D 72%); }
.home { padding-bottom: calc(clamp(64px, 12vh, 124px) + 70px); }
.home-foot { background: rgba(16, 12, 12, .55); border-radius: var(--r-s); padding: 8px 12px 0; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.purple-last { flex-wrap: wrap; }
.purple-pass { border: 1px solid var(--ligne-2); background: rgba(242, 234, 219, .04); }

/* ---------- Le 96 : annonce juste affichée en grand chez tout le monde */
.g96-big { position: fixed; inset: 0; z-index: 70; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; pointer-events: none;
  background: radial-gradient(circle at 50% 46%, rgba(255, 210, 63, .28), rgba(16, 12, 12, .82) 62%);
  animation: g96-in .35s var(--ressort) both, g96-out .45s ease-in 2.15s forwards; }
.g96-big-who { font-weight: 700; font-size: 1.1rem; color: var(--papier); }
.g96-big-n { font: 400 clamp(8rem, 46vw, 15rem)/.9 var(--f-titre); color: var(--jaune); text-shadow: 0 10px 50px rgba(255, 210, 63, .45); animation: g96-pop .55s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes g96-in { from { opacity: 0; } }
@keyframes g96-out { to { opacity: 0; } }
@keyframes g96-pop { from { transform: scale(.3) rotate(-8deg); opacity: 0; } }

/* ---------- salon : tout tient dans l'écran (joueurs en bande, jeux en carrousel) */
.lobby { gap: 16px; }
.lobby h1 { font-size: 1.6rem; }
.register { display: flex; flex-direction: column; gap: 8px; }
.register h2 { font-size: 1.1rem; margin: 0; }
.register .players { flex-direction: row; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; }
.register .players::-webkit-scrollbar { display: none; }
.register .player, .register .player:first-child, .players .player { flex: none; flex-direction: column; flex-wrap: nowrap; gap: 4px; width: 68px; min-height: 0; padding: 4px 0; border: 0; text-align: center; }
.register .player-n, .register .player-meta { display: none; }
.register .player-name { flex: none; justify-content: center; font-size: .85rem; max-width: 68px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; display: block; }
.register .player-name em { display: none; }
.register .empty { padding: 4px 0; font-size: .95rem; }
.invite { padding: 12px; gap: 12px; flex-wrap: nowrap; justify-content: flex-start; }
.invite .qr { width: 104px; height: 104px; }
.invite-txt { gap: 2px; }
.invite-txt .muted.small { display: none; }
.invite .code { font-size: 2.2rem; }
.games-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.games-h h2 { font-size: 1.3rem; }
.games-rail {
  display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 16px;
  margin: 0 -16px; padding: 4px 16px 14px; scrollbar-width: none; overscroll-behavior-x: contain;
}
.games-rail::-webkit-scrollbar { display: none; }
.gcard {
  position: relative; flex: 0 0 min(64vw, 250px); scroll-snap-align: start; display: flex; flex-direction: column; overflow: hidden;
  padding: 0; text-align: left; cursor: pointer; color: var(--papier);
  border-radius: 22px; border: 1px solid var(--ligne); background: var(--surface);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  box-shadow: 0 18px 36px -20px rgba(var(--c), .7);
  transition: scale .32s cubic-bezier(.3, 1.7, .5, 1), box-shadow .2s ease;
  animation: tuile .45s var(--ressort) backwards; animation-delay: calc(var(--n, 1) * 40ms);
}
.gcard:active { scale: .96; transition-duration: .06s; }
.game-art { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; }
.gcard-no { position: absolute; top: 10px; left: 12px; padding: 2px 9px; border-radius: 999px; background: rgba(16, 12, 12, .55); font: 700 .78rem/1.3 var(--f-texte); color: var(--papier); }
.gcard-body { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px 14px; }
.gcard-name { font: 400 1.3rem/1.1 var(--f-titre); }
.gcard-min { font: 600 .82rem/1.2 var(--f-texte); color: var(--poussiere); }
.gcard.is-off { opacity: .5; }
.gcard.is-off .gcard-min { color: var(--rouge-vif); }
.hist-sec { gap: 0; }
@media (hover: hover) { .gcard:hover { box-shadow: 0 22px 40px -18px rgba(var(--c), .9); } }

/* fiche d'un jeu : glisse depuis la droite */
.sheet-wrap.is-side { align-items: stretch; justify-content: flex-end; }
.is-side .sheet {
  max-width: 480px; max-height: none; height: 100%; border-radius: 24px 0 0 24px; border-top: 0; border-left: 1px solid var(--ligne-2);
  padding-top: calc(14px + env(safe-area-inset-top, 0px)); animation: glisse .34s var(--ressort) both;
}
.is-side .sheet::before { display: none; }
.side-art { margin: -4px 0 4px; border-radius: var(--r); overflow: hidden; box-shadow: 0 16px 34px -18px rgba(var(--c), .9); }
.side-art .game-art { aspect-ratio: 2 / 1; }
@keyframes glisse { from { transform: translateX(100%); } }

/* ---------- écran de jeu : compact, l'essentiel sans faire défiler */
.party-main { gap: 12px; padding-top: 12px; padding-bottom: 16px; }
.game { gap: 12px; }
.game-head { align-items: center; }
.game-no { display: none; }
.game-head h1 { font-size: 1.7rem; }
.game-head + .ruban, .game > .ruban, .game > .ruban-txt { display: none; }
.game-tools .btn-small { min-height: 44px; padding: 6px 12px; }
.turn { flex-direction: row; align-items: center; gap: 10px; }
.turn-l { font-size: .9rem; }
.turn-who { font-size: 1.45rem; gap: 8px; }
.turn-who .av-m { width: 34px; height: 34px; }
.act { padding: 12px; gap: 10px; }
.act h3 { font-size: 1.15rem; }
.hint { font-size: .85rem; }
.hostbar { padding-top: 8px; gap: 6px; border-top-color: var(--ligne); }
.hostbar-l { display: none; }
.purple, .g96, .pipo, .jn, .ose, .qo, .tc, .hippo, .tombeau { gap: 12px; }
.fire { width: 84px; height: 80px; }
.fire-n { width: 48px; height: 48px; font-size: 1.8rem; }
.purple-pile { min-height: 96px; padding: 10px 8px; }
.purple-pile .pc-m { width: 54px; height: 76px; }
.purple-last { padding: 10px 12px; gap: 10px; font-size: .95rem; }
.purple-last .tampon { font-size: 1.1rem; }
.purple-btns { gap: 6px; }
.purple-btns .btn-big { min-height: 50px; font-size: 1rem; }
.purple-pass { padding: 10px; gap: 8px; }
.purple-pass p { font-size: .9rem; }
.btn-mort { min-height: 56px; }
.jn-card, .ose-card, .qo-card { padding: 30px 16px 18px; }
.g96-hidden { padding: 10px 12px; gap: 12px; }
.g96-q { font-size: 2.2rem; width: 2.6rem; }
.g96-last { padding: 10px 12px; }
.announce-num { font-size: 2.2rem; min-height: 2.8rem; padding: 2px; }
.keypad .key { min-height: 48px; }
.word-card { padding: 20px 14px 16px; }
.dock { padding-top: 8px; }
/* Le 96 : le clavier de l'annonce monte du bas, par-dessus la main (pas de défilement) */
.announce-sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; max-width: 560px; margin: 0 auto; gap: 8px;
  padding: 14px max(14px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
  background: #1F1A18; border: 1px solid var(--ligne-2); border-bottom: 0; border-radius: 24px 24px 0 0;
  box-shadow: 0 -18px 40px -10px rgba(0, 0, 0, .8); animation: monte .3s var(--ressort) both;
}
.announce-top { display: flex; align-items: center; gap: 12px; }
.announce-top p { flex: 1; font-size: .95rem; }
.side-art .game-art { aspect-ratio: 16 / 9; }
.seat { min-width: 64px; padding: 6px 4px; }
.seat .av-m { width: 34px; height: 34px; }
/* compacts par jeu (téléphone en portrait) */
.hippo-track { padding: 10px 8px; gap: 4px; }
.hippo-run { height: 42px; }
.hippo-run .pc, .hippo-horse .pc { width: 30px; height: 42px; }
.hippo-levels .pc { width: 26px; height: 36px; }
.horse-btn { min-height: 52px; padding: 6px 8px; }
.horse-btn .pc { width: 26px; height: 36px; }
.tomb { gap: 4px; padding: 10px 6px; }
.tomb .pc-s { width: clamp(30px, 9vw, 40px); }
.act .hand .pc-l { width: clamp(52px, 15vw, 66px); }
.act-hand .hand { padding-bottom: 38px; }
.qo-card { padding: 22px 16px 16px; }
.qo-input { min-height: 84px; }
.tc-table { padding: 12px; gap: 14px; }
.waiting { padding: 8px; }
.local-who { font-size: .9rem; }
.hippo-run { height: 36px; }
.hippo-run .pc, .hippo-horse .pc { width: 26px; height: 36px; }
.horse-btn { min-height: 46px; font-size: .9rem; line-height: 1.15; }
.horses { gap: 6px; }
.hippo .waiting, .tombeau .waiting { padding: 2px; font-size: .9rem; }
.tomb .pc-s { width: clamp(28px, 8vw, 36px); }
.tomb-row { gap: 6px; }
.act .btn-big { min-height: 50px; }
.seg-btn { min-height: 44px; }
.game-head h1 { font-size: clamp(1.35rem, 6.4vw, 1.7rem); }
.game-tools { flex-wrap: nowrap; flex: none; }
.hostbar { flex-direction: row; flex-wrap: wrap; }
.hostbar .btn { flex: 1 1 140px; min-height: 44px; padding: 6px 10px; font-size: .92rem; }
.hostbar .btn-big { min-height: 50px; font-size: 1rem; }

/* =====================================================================================================
   Passe « check-list site et app » : pas de verre dépoli, arrondis discrets, pas de pastilles, pas de halo
   ni d'ombre douce sur les cartes, pas de dégradé violet ni de texte en dégradé, animations de 250 ms au plus
   et sans rebond. Les surfaces sont opaques (neutres teintés), séparées par des filets fins.
   ===================================================================================================== */
:root {
  --surface: #221C1A;
  --surface-2: #2B2421;
  --r: 8px;
  --r-s: 6px;
  --ressort: cubic-bezier(.2, .7, .3, 1);
}
.paper, .paper.kraft, .paper.rose, .tile, .gcard, .choice, .act, .panel, .home-foot, .sheet-wrap, .topbar, .rules.paper {
  -webkit-backdrop-filter: none; backdrop-filter: none;
}
.paper, .paper.kraft, .paper.rose { background: var(--surface); }
.topbar { background: #181312; }
.sheet-wrap { background: rgba(16, 12, 12, .72); }
.home-foot { background: transparent; padding: 8px 0 0; }
.btn-main, .choice-main, .gcard, .ose-card.paper, .jn-card.paper, .qo-card.paper, .word-card.paper, .pen, .announce-sheet, .side-art, .toast, .btn-mort { box-shadow: none; }
.ose-card.paper, .jn-card.paper, .qo-card.paper, .word-card.paper { border: 1px solid #CFC3AC; }
.chip, .you, .tag, .role-tag, .gcard-no, .dock-who, .mort-son, .dock-mini, .jn-badge { border-radius: 4px; }
.choice, .gcard, .tile, .pen, .side-art, .is-side .sheet { border-radius: var(--r); }
.sheet { border-radius: 10px 10px 0 0; }
.is-side .sheet { border-radius: 10px 0 0 10px; }
.announce-sheet { border-radius: 10px 10px 0 0; }
.choice-ico, .tile-ico { border-radius: 6px; }
.icon-round { border-radius: var(--r-s); width: 44px; height: 44px; }
.choice, .gcard { background: var(--surface); }
.choice:hover { background: var(--surface-2); }
.choice-main, .choice-main:hover { background: var(--jaune); }
.choice-main:hover { background: var(--jaune-2); }
.choice::after { opacity: .7; }
.tile, .tile:hover, .tile.kraft:hover, .tile.rose:hover { background: var(--surface); }
.gcard { border-color: var(--ligne-2); }
@media (hover: hover) { .gcard:hover { box-shadow: none; border-color: rgba(var(--c), .9); } }
.gcard-no { background: #181312; }
.btn { background: var(--surface); }
.btn:hover:not(:disabled), .paper .btn:hover:not(:disabled) { background: var(--surface-2); }
.icon-btn { background: var(--surface); }
.input, .codebox-cell, .seg { background: #1A1514; }
.chip { background: #1A1514; }
.pen { background: var(--surface); }
.pen-defi-txt { background: var(--surface-2); }
.pen-big b, .pen-big-t { color: #FF8A6A; }
.dock::before { background: #161211; border-top: 1px solid var(--ligne); }

/* code du salon : lisible sur fond sombre */
.paper .code, .invite .code { color: var(--jaune); }

/* animations : courtes, sans rebond */
.ecran { animation: entree .2s ease-out backwards; }
.sheet { animation: monte .22s ease-out both; }
.is-side .sheet { animation: glisse .22s ease-out both; }
.sheet-wrap { animation: fondu .15s ease-out both; }
.choice, .gcard, .tile { animation: tuile .22s ease-out backwards; }
.choice:nth-child(2) { animation-delay: .04s; }
.choice:nth-child(3) { animation-delay: .08s; }
.gcard, .tile { animation-delay: calc(min(var(--n, 1), 4) * 30ms); }
.choice, .gcard, .btn, .icon-btn, .key, .pgrid-btn, .maker-opt, .horse-btn, .seg-btn, .qo-vote, .menu-item, .dist-who, .pc-btn, .cran, .link, .multi-btn {
  transition: scale .12s ease-out, background-color .12s ease, border-color .12s ease;
}
.btn:active:not(:disabled), .choice:active, .gcard:active { scale: .97; }
.pose { animation: poser .2s ease-out both; }
.ose-card.paper, .jn-card.paper, .qo-card.paper { animation: carte .22s ease-out both; }
@keyframes carte { from { opacity: 0; transform: translateY(10px); } }
.pen { animation: monte .22s ease-out both; }
.pen-take { animation: monte .22s ease-out both; }
.pen-big { animation: none; }
.hippo-winner, .pipo-role, .verdict-who, .end-title, .report-head h2, .tc-verdict { animation: fondu .2s ease-out backwards; }
.maker-preview, .av-win .bouille, .av-drink .bouille, .fire-n { animation-timing-function: ease-out; animation-duration: .2s; }
.pen-dots i { transition: background-color .12s ease; }
.pen-dots i.on { scale: 1; }
.rules-fold summary::after { transition: transform .15s ease; }
.flip3d-in { animation-duration: .25s; animation-timing-function: ease-out; }

/* Purple jusqu'à la mort : bouton plein (pas de dégradé), titre en couleur pleine, lumières rouge, blanc et jaune */
.btn-mort, .btn-mort:hover:not(:disabled) { background: var(--rouge); color: #FFF4EC; border: 1.5px solid #E5502F; }
.btn-mort:hover:not(:disabled) { background: #B02A1A; }
.btn-mort::after { display: none; }
.btn-mort.is-armed { animation: none; background: var(--jaune); color: var(--encre); border-color: var(--jaune); outline: 0; }
.mort { background: #120A09; animation: fondu .2s ease-out both; }
.mort-title { background: none; -webkit-background-clip: border-box; background-clip: border-box; color: var(--jaune); }
.mort-spots i { background: linear-gradient(180deg, rgba(229, 80, 47, .35), rgba(229, 80, 47, 0) 70%); mix-blend-mode: normal; filter: none; }
.mort-spots i:nth-child(2) { background: linear-gradient(180deg, rgba(255, 210, 63, .28), rgba(255, 210, 63, 0) 70%); }
.mort-spots i:nth-child(3) { background: linear-gradient(180deg, rgba(242, 234, 219, .16), rgba(242, 234, 219, 0) 60%); }
.mort-spots i:nth-child(4) { background: linear-gradient(180deg, rgba(229, 80, 47, .22), rgba(229, 80, 47, 0) 60%); }
.mort-card { animation: tombe-c .22s ease-out backwards; filter: none; }
.mort-pair { animation: none; }
.mort-taunt { animation: fondu .2s ease-out backwards; }
.mort-end .tampon { color: var(--jaune); animation: tampon .2s ease-out both; }
.mort.is-done::before { display: none; }
.mort-count b { vertical-align: -3px; }
.mort-close { animation: fondu .2s 1s ease-out both; }
.mort-son { background: #1A1514; }

/* Le 96 : gros total sans halo */
.g96-big { background: rgba(18, 14, 13, .9); animation: g96-in .2s ease-out both, g96-out .25s ease-in 2.35s forwards; }
.g96-big-n { text-shadow: none; animation: g96-pop .22s ease-out both; }
@keyframes g96-pop { from { transform: scale(.85); opacity: 0; } }
.fire-word { animation: fondu .2s ease-out both; }
.boom-word, .ware-word, .ware-flash { animation-duration: .2s; animation-timing-function: ease-out; }
.gcard.is-off { opacity: 1; }
.gcard.is-off .game-art { opacity: .45; }
.gcard.is-off .gcard-name { color: var(--poussiere); }
.gcard.is-off .gcard-min { color: #F07A5E; }

/* carrousel à la souris : flèches visibles seulement avec un pointeur fin (ordinateur) */
.rail-nav { display: none; gap: 6px; }
.rail-next .ico { transform: scaleX(-1); }
@media (hover: hover) and (pointer: fine) {
  .rail-nav { display: inline-flex; }
  .games-tip { display: none; }
  .games-rail { cursor: grab; scrollbar-width: thin; scrollbar-color: var(--ligne-2) transparent; }
  .games-rail::-webkit-scrollbar { display: block; height: 6px; }
  .games-rail::-webkit-scrollbar-thumb { background: var(--ligne-2); border-radius: 3px; }
  .games-rail.is-drag { cursor: grabbing; scroll-snap-type: none; }
  .games-rail.is-drag .gcard { pointer-events: none; }
}
.games-h { align-items: center; }
/* grand écran : le carrousel prend toute la largeur de la fenêtre */
@media (min-width: 700px) {
  .games-rail { width: 100vw; margin-left: calc(50% - 50vw); margin-right: 0; padding-left: max(16px, calc(50vw - 264px)); padding-right: 32px; scroll-padding: 0 max(16px, calc(50vw - 264px)); }
}
/* boutons : les variantes passent après le fond par défaut (sinon le bouton principal perd son jaune) */
.btn-main, .paper .btn-main { background: var(--jaune); border-color: var(--jaune); color: var(--encre); }
.btn-main:hover:not(:disabled), .paper .btn-main:hover:not(:disabled) { background: var(--jaune-2); border-color: var(--jaune-2); }
.btn-main:disabled { background: var(--jaune); color: var(--encre); }
.btn-ghost, .btn-ghost:hover:not(:disabled) { background: transparent; }
.btn.is-on { background: var(--papier); color: var(--encre); }
.btn-mort, .btn-mort:hover:not(:disabled) { background: var(--rouge); }
.btn-mort:hover:not(:disabled) { background: #B02A1A; }
.btn-mort.is-armed { background: var(--jaune); }
</style>
